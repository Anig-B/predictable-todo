name: gtodo
description: QuestLog — Gamified Todo App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  confetti: ^0.7.0
  shared_preferences: ^2.5.4
  flutter_staggered_grid_view: ^0.7.0
  supabase_flutter: ^2.12.2
  image_picker: ^1.2.1
  timeago: ^3.7.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
